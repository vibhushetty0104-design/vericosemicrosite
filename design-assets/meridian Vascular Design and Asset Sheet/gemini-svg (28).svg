<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none" style="background:transparent;">
  <defs>
    <linearGradient id="patient-leg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5ECE1" />
      <stop offset="70%" stop-color="#E5D6C3" />
      <stop offset="100%" stop-color="#CCBCA9" />
    </linearGradient>
    <linearGradient id="probe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4ECE6" />
      <stop offset="35%" stop-color="#CADAD0" />
      <stop offset="100%" stop-color="#8DAA9D" />
    </linearGradient>
    <linearGradient id="acoustic-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8DAA9D" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#E4ECE6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#E4ECE6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="wave-color" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CE5B40" />
      <stop offset="50%" stop-color="#E0523C" />
      <stop offset="100%" stop-color="#145D4F" />
    </linearGradient>
  </defs>

  <!-- Patient leg in side profile -->
  <path d="M60,400 C80,380 150,330 190,290 C225,255 270,180 300,120 C325,70 345,40 375,25 L475,200 C465,240 435,310 395,360 C345,420 280,455 240,475 C195,495 90,475 60,440 Z" fill="url(#patient-leg-grad)" stroke="#8DAA9D" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Transdermal underlying venous mapping paths inside the leg -->
  <path d="M225,290 C252,240 285,180 322,120" fill="none" stroke="#0B4036" stroke-width="10" stroke-linecap="round" opacity="0.85" />
  <path d="M225,290 C252,240 285,180 322,120" fill="none" stroke="#CE5B40" stroke-width="3.25" stroke-linecap="round" stroke-dasharray="2 4" />

  <!-- 2.5D Acoustic scan field from transducer tip (Beam) -->
  <polygon points="175,182 125,275 245,355 220,195" fill="url(#acoustic-beam)" />
  <path d="M152,210 C140,230 152,255 178,268 C198,278 214,265 204,240" fill="none" stroke="#8DAA9D" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Contact Gel application (Interface boundary) -->
  <ellipse cx="192" cy="188" rx="25" ry="7" transform="rotate(-30 192 188)" fill="#E4ECE6" opacity="0.8" />
  <ellipse cx="192" cy="188" rx="25" ry="7" transform="rotate(-30 192 188)" fill="none" stroke="#8DAA9D" stroke-width="1.5" />

  <!-- Hand Applying Transducer / Probe interface -->
  <g id="hand-and-probe" transform="translate(18, -10)">
    <!-- Probe Cable -->
    <path d="M210,132 C230,120 255,115 285,120" fill="none" stroke="#4A635D" stroke-width="4.5" stroke-linecap="round" />
    <!-- Transducer Base Housing Unit -->
    <path d="M152,192 L198,168 C204,165 204,152 201,132 L194,106 C192,96 182,90 172,95 L126,120 C116,125 114,136 116,146 L124,172 C126,190 134,195 152,192 Z" fill="url(#probe-grad)" stroke="#0B4036" stroke-width="2" />
    <path d="M149,191.5 L196,168" stroke="#0B4036" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Grab / Clenching fingers overlay -->
    <g fill="#CCBCA9" stroke="#541B10" stroke-width="1.5" stroke-linecap="round">
      <path d="M158,112 C142,108 126,105 114,115 C110,119 113,126 120,124 C132,120 148,116 158,112 Z" />
      <path d="M214,132 C225,125 235,135 220,144" />
      <path d="M210,152 C220,145 228,155 214,163" />
      <path d="M202,170 C210,165 218,172 204,181" />
      <path d="M214,132 C235,145 255,175 250,200 C246,215 220,225 190,215" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Doppler Wave / Monitor screen overlay in upper portion (No diagnostic text) -->
  <g id="screen-display" transform="translate(180, 50)">
    <rect width="130" height="95" rx="8" fill="#142F28" stroke="#D5E0D8" stroke-width="1.5" />
    <!-- Active tracing signals (Simplified illustrative scan wave) -->
    <path d="M10,65 Q25,40 40,65 T70,65 T90,20 T110,75 T120,65" fill="none" stroke="url(#wave-color)" stroke-width="4.25" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="90" cy="20" r="3" fill="#CE5B40" />
    <line x1="10" y1="18" x2="115" y2="18" stroke="#4C685C" stroke-dasharray="2 3" />
    <line x1="10" y1="75" x2="115" y2="75" stroke="#4C685C" stroke-dasharray="2 3" />
  </g>
</svg>